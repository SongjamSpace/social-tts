<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Agent Connect</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <style>
    body { margin: 0; background: #060608; color: #e5e5e5; font-family: system-ui, -apple-system, sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #toolbar { padding: 8px 12px; background: #0d0d0d; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 8px; }
    #toolbar button { padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); color: #e5e5e5; cursor: pointer; font-size: 13px; }
    #toolbar button:hover { background: rgba(255,255,255,0.1); }
    #toolbar button.primary { background: #b91c1c; border-color: #dc2626; }
    #toolbar button.primary:hover { background: #dc2626; }
    #status { font-size: 12px; color: #737373; }
    #terminal-container { flex: 1; padding: 8px; min-height: 0; }
    #terminal { width: 100%; height: 100%; }

    /* Splash */
    #splash {
      position: fixed; inset: 0; background: #060608;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100;
    }
    #splash.hidden { display: none; }
    #splash-logo {
      max-width: 80px;
      max-height: 80px;
      width: auto;
      height: auto;
      margin-bottom: 16px;
      object-fit: contain;
      object-position: center;
      flex-shrink: 0;
      align-self: center;
      opacity: 0;
      animation: splashEntrance 0.45s ease-out forwards, splashBreath 2.5s ease-in-out 0.45s infinite;
    }
    #splash-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 8px 0;
      opacity: 0;
      animation: splashEntrance 0.45s ease-out 0.08s forwards;
    }
    #splash-status { font-size: 13px; color: #737373; }
    #splash-error { font-size: 12px; color: #ef4444; margin-top: 12px; max-width: 320px; text-align: center; }
    @keyframes splashEntrance {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes splashBreath {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>
<body>
  <!-- Splash: shown until SSH connected or error -->
  <div id="splash">
    <img id="splash-logo" src="assets/eve-logo.png" alt="" />
    <h1 id="splash-title">Agent Connect</h1>
    <p id="splash-status">Open a .droplet file to connect</p>
    <p id="splash-error" style="display: none;"></p>
  </div>

  <!-- Main app: toolbar + welcome or terminal -->
  <div id="app">
    <div id="toolbar">
      <span id="status">Open a .droplet file to connect</span>
    </div>
    <div id="welcome">
      <h1>Agent Connect</h1>
      <p>Double-click a .droplet connection file (from your spawn success page) to connect to your droplet.</p>
    </div>
    <div id="terminal-container" style="display: none;">
      <div id="terminal"></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
