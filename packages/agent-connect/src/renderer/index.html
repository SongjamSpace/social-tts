<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Agent Connect</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <style>
    body { margin: 0; background: #0d0d0d; color: #e5e5e5; font-family: system-ui, sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #toolbar { padding: 8px 12px; background: #1a1a1a; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 8px; }
    #toolbar button { padding: 6px 12px; border-radius: 6px; border: 1px solid #444; background: #262626; color: #e5e5e5; cursor: pointer; font-size: 13px; }
    #toolbar button:hover { background: #333; }
    #toolbar button.primary { background: #b91c1c; border-color: #dc2626; }
    #toolbar button.primary:hover { background: #dc2626; }
    #status { font-size: 12px; color: #737373; }
    #terminal-container { flex: 1; padding: 8px; min-height: 0; }
    #terminal { width: 100%; height: 100%; }
    #welcome { padding: 24px; max-width: 400px; }
    #welcome h1 { font-size: 18px; margin-bottom: 8px; }
    #welcome p { font-size: 13px; color: #a3a3a3; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <span id="status">Open a .opencaw file to connect</span>
    </div>
    <div id="welcome">
      <h1>Agent Connect</h1>
      <p>Double-click a .opencaw connection file (from your spawn success page) to connect to your droplet.</p>
    </div>
    <div id="terminal-container" style="display: none;">
      <div id="terminal"></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
