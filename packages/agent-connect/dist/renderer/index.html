<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Agent Connect</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
  <style>
    body { margin: 0; background: #060608; color: #e5e5e5; font-family: system-ui, -apple-system, sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #toolbar { padding: 8px 12px; background: #0d0d0d; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    #toolbar-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #toolbar button { padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.08); color: #e5e5e5; cursor: pointer; font-size: 13px; font-weight: 600; }
    #toolbar button:hover { background: rgba(255,255,255,0.14); }
    #status { font-size: 12px; color: #737373; flex: 1; min-width: 100px; }
    #terminal-container { flex: 1; padding: 8px; min-height: 0; display: flex; flex-direction: column; }
    #terminal { width: 100%; flex: 1; min-height: 0; }

    #splash {
      position: fixed; inset: 0; background: #060608;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; padding: 24px; box-sizing: border-box;
    }
    #splash.hidden { display: none; }
    #splash-logo {
      max-width: 80px; max-height: 80px; margin-bottom: 16px; object-fit: contain; opacity: 0;
      animation: splashEntrance 0.45s ease-out forwards, splashBreath 2.5s ease-in-out 0.45s infinite;
    }
    #splash-title { font-size: 20px; font-weight: 800; margin: 0 0 8px 0; opacity: 0; animation: splashEntrance 0.45s ease-out 0.08s forwards; }
    #splash-status { font-size: 13px; color: #737373; text-align: center; }
    #splash-error { font-size: 12px; color: #ef4444; margin-top: 12px; text-align: center; max-width: 360px; }
    @keyframes splashEntrance { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
    @keyframes splashBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  </style>
</head>
<body>
  <div id="splash">
    <img id="splash-logo" src="assets/eve-logo.png" alt="" />
    <h1 id="splash-title">Agent Connect</h1>
    <p id="splash-status">Open a .droplet file to connect</p>
    <p id="splash-error" style="display: none;"></p>
  </div>

  <div id="app">
    <div id="toolbar">
      <div id="toolbar-row">
        <span id="status">Connected</span>
      </div>
    </div>
    <div id="welcome">
      <h1>Agent Connect</h1>
      <p>Double-click a .droplet connection file to connect.</p>
    </div>
    <div id="terminal-container" style="display: none;">
      <div id="terminal"></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
